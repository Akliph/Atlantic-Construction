<!DOCTYPE html>
<html>

    <!-- METADATA -->
    <head>
        <meta charset="utf-8">
        <title>Atlantic Construction & Management, Inc.</title>
        <link rel="stylesheet" href="styles.css" type="text/css">
        <!--[if IE]>
		<script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
		<![endif]-->


        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Roboto:wght@400;600&display=swap" rel="stylesheet">

    </head>    

    <!-- ===================================================== CONTENT ======================================================= -->
    <body>

        <!-- FETCH HEADER-->
        <div id="header-container"></div>
        <script>
            fetch("header.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            });
        </script>

        <script src="noscroll.js"></script>

        <div class="form-card">
            <h1>Contact Us</h1>
            <form id="contact-form">
                <input class="form-email form-input" name="email" type="email" placeholder="Your email" required>
                <input class="form-name form-input" name="contact" type="text" placeholder="Contact name" required>
                <textarea class="form-message form-input" name="message" type="text" placeholder="Message" required></textarea>
                <button class="form-button" id="form-button" type="submit">Submit</button>
            </form>
            <p id="status-message"></p>
        </div>

        <script>
            let contactForm, formButton, statusText;
            contactForm = document.getElementById("contact-form");
            formButton = document.getElementById("form-button");
            statusText = document.getElementById("status-message");

            contactForm.addEventListener("submit", async(e) => {
                e.preventDefault();

                formButton.disabled = true;
                formButton.textContent = "Sending...";

                const formData = new FormData(contactForm);
                const body = new URLSearchParams(formData);
                try {
                    const res = await fetch("/contact", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body
                    });

                    if(res.ok)
                    {
                        formButton.disabled = true;
                        contactForm.reset()
                        formButton.textContent = "Sent!"
                        statusText.textContent = "Thank you for your message!"
                    }
                    else{
                        throw new Error("Improper response from server!")
                    }

                } catch (error){
                    formButton.disabled = false;
                    formButton.textContent = "Try Again"
                    statusText.textContent = "Something went wrong..."
                }
            });
        </script>

        <script src="main.js"></script>
    </body>
</html>
